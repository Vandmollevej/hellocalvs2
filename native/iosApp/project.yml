# iPhone app project. Generate the Xcode project with `xcodegen generate`
# (brew install xcodegen) — HelloCal.xcodeproj is not committed.
# The screens come from the shared Kotlin framework (native/shared), built by
# the "Build Kotlin framework" phase below.
name: HelloCal
options:
  bundleIdPrefix: dk.packroff
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
targets:
  HelloCal:
    type: application
    platform: iOS
    sources:
      - path: HelloCal
      # The app writes the device token the widgets read (shared Keychain group).
      - path: ../ios/HelloCalWidgets/SnapshotStore.swift
      - path: ../ios/HelloCalWidgets/WidgetSnapshot.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.packroff.hellocal
        INFOPLIST_FILE: HelloCal/Info.plist
        CODE_SIGN_ENTITLEMENTS: HelloCal/HelloCal.entitlements
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME) $(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework $(SRCROOT)/../shared/build/bin/iosArm64/debugFramework"
        OTHER_LDFLAGS: "$(inherited) -framework Shared"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          # CI builds the framework before xcodebuild; locally Xcode builds it here.
          if [ -n "$HELLOCAL_SKIP_GRADLE" ] || [ -d "$SRCROOT/../shared/build/bin/iosSimulatorArm64/debugFramework/Shared.framework" -a "$CI" = "true" ]; then exit 0; fi
          cd "$SRCROOT/.."
          if [ -x ./gradlew ]; then ./gradlew :shared:embedAndSignAppleFrameworkForXcode; else gradle :shared:embedAndSignAppleFrameworkForXcode; fi
    dependencies:
      - target: HelloCalWidgets
        embed: true
  HelloCalWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ../ios/HelloCalWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.packroff.hellocal.widgets
        INFOPLIST_FILE: HelloCalWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: HelloCalWidgets/HelloCalWidgets.entitlements
        GENERATE_INFOPLIST_FILE: NO
schemes:
  HelloCal:
    build:
      targets:
        HelloCal: all
        HelloCalWidgets: all
