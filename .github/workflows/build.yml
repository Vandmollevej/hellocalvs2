name: Build and deploy

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/vandmollevej/hellocalvs2:latest
            ghcr.io/vandmollevej/hellocalvs2:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync deployment definition
        run: |
          set -euo pipefail
          cp compose.production.yaml /deploy/compose.production.yaml
          # Alle agenter, som compose.production.yaml bygger lokalt (build: ./scripts/...).
          for agent in image-agent frida-import hellofresh-import rema1000-import quality-control-agent; do
            mkdir -p "/deploy/scripts/$agent"
            cp -R "scripts/$agent/." "/deploy/scripts/$agent/"
          done
          # Runneren ser serverens app-mappe som /deploy. Compose læser
          # build-konteksterne via --project-directory-stien, så den skal også
          # findes inde i runneren.
          if [ ! -e /volume1/docker/App/hellocal-v2 ]; then
            mkdir -p /volume1/docker/App
            ln -s /deploy /volume1/docker/App/hellocal-v2
          fi

      - name: Select release and pull images
        run: |
          set -euo pipefail
          cd /deploy
          if grep -q '^HELLOCAL_TAG=' .env.production; then
            sed -i "s/^HELLOCAL_TAG=.*/HELLOCAL_TAG=${{ github.sha }}/" .env.production
          else
            printf '\nHELLOCAL_TAG=%s\n' '${{ github.sha }}' >> .env.production
          fi
          docker compose --project-directory /volume1/docker/App/hellocal-v2 -f compose.production.yaml --env-file .env.production pull

      - name: Deploy database migrations and app
        run: |
          set -euo pipefail
          cd /deploy
          docker compose --project-directory /volume1/docker/App/hellocal-v2 -f compose.production.yaml --env-file .env.production up -d db migrate app

      - name: Build and start catalog agents
        run: |
          set -euo pipefail
          cd /deploy
          docker compose --project-directory /volume1/docker/App/hellocal-v2 -f compose.production.yaml --env-file .env.production up -d --build image-agent frida-agent hellofresh-agent rema1000-agent

      - name: Build and start quality-control agent
        run: |
          set -euo pipefail
          cd /deploy
          docker compose --project-directory /volume1/docker/App/hellocal-v2 -f compose.production.yaml --env-file .env.production up -d --build quality-control-agent
