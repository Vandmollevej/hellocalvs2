name: Diag scan failures (temporary, read-only)

on:
  push:
    branches:
      - claude/diag-scan-failures

jobs:
  diag:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Read recent quick-created products and their logs (read-only)
        run: |
          set -u
          cd /deploy
          q() { docker compose --project-directory /volume1/docker/App/hellocal-v2 -f compose.production.yaml --env-file .env.production exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off' <<< "BEGIN READ ONLY; $1; ROLLBACK;"; }
          C="docker compose --project-directory /volume1/docker/App/hellocal-v2 -f compose.production.yaml --env-file .env.production"
          echo "image-agent started: $($C ps --format '{{.CreatedAt}}' image-agent 2>/dev/null | head -1)"
          echo "lines with hidden key (since 20m): $($C logs --no-log-prefix --since 20m image-agent 2>&1 | grep -c 'key=\*\*\*' || true)"
          echo "lines with visible key (since 20m): $($C logs --no-log-prefix --since 20m image-agent 2>&1 | grep -c 'key=AIza' || true)"
          $C logs --no-log-prefix --since 20m image-agent 2>&1 | grep -i "Google-søgningen" | sed -E 's/key=[^&[:space:]]+/key=***/g' | tail -2 || true
