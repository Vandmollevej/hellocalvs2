name: Diag scan failures (temporary, read-only)

on:
  push:
    branches:
      - claude/diag-scan-failures

jobs:
  diag:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Read recent quick-created products and their logs (read-only)
        run: |
          set -uo pipefail
          cd /deploy
          q() { docker compose --project-directory /volume1/docker/App/hellocal-v2 -f compose.production.yaml --env-file .env.production exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off' <<< "BEGIN READ ONLY; $1; ROLLBACK;"; }
          C="docker compose --project-directory /volume1/docker/App/hellocal-v2 -f compose.production.yaml --env-file .env.production"
          echo "=== Backlog before first scheduler start ==="
          q "SELECT channel, event, count(*), min(\"createdAt\"), max(\"createdAt\") FROM outbound_messages WHERE status='QUEUED' GROUP BY 1,2 ORDER BY 3 DESC"
          q "SELECT provider, status, count(*) FROM subscriptions GROUP BY 1,2"
          q "SELECT count(*) AS closed_over_90d FROM users WHERE \"closedAt\" < now() - interval '90 days' AND \"forgottenAt\" IS NULL"
          q "SELECT count(*) AS closed_any FROM users WHERE \"closedAt\" IS NOT NULL"
          q "SELECT enabled, count(*), min(\"nextRunAt\") FROM partner_report_schedules GROUP BY 1"
          q "SELECT count(*) AS pending_products_48h FROM products WHERE status='PENDING' AND \"privateOwnerId\" IS NULL AND \"createdAt\" < now() - interval '48 hours' AND \"escalationSentAt\" IS NULL"
          q "SELECT count(*) AS pending_bugs_48h FROM bug_reports WHERE status='PENDING' AND \"createdAt\" < now() - interval '48 hours' AND \"escalationSentAt\" IS NULL"
          q "SELECT \"key\", enabled, \"lastStartedAt\" FROM scheduled_jobs ORDER BY 1"
