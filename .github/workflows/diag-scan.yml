name: Diag scan failures (temporary, read-only)

on:
  push:
    branches:
      - claude/diag-scan-failures

jobs:
  diag:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Read recent quick-created products and their logs (read-only)
        run: |
          set -uo pipefail
          cd /deploy
          q() { docker compose --project-directory /volume1/docker/App/hellocal-v2 -f compose.production.yaml --env-file .env.production exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off' <<< "BEGIN READ ONLY; $1; ROLLBACK;"; }
          echo "=== Recovery job state ==="
          q "SELECT key, enabled, \"intervalMinutes\", \"lastStartedAt\", \"lastRunAt\", \"lastStatus\", left(\"lastMessage\",400) msg FROM scheduled_jobs WHERE key IN ('quick-enrichment-recovery','back-photo-local','back-photo-scan')"
          echo "=== Recovery job runs ==="
          q "SELECT \"jobKey\", to_char(\"startedAt\",'MM-DD HH24:MI') s, to_char(\"finishedAt\",'MM-DD HH24:MI') f, status, \"runCount\", left(message,400) msg FROM scheduled_job_runs WHERE \"jobKey\" IN ('quick-enrichment-recovery','back-photo-local') AND \"finishedAt\" > now() - interval '14 hours' ORDER BY \"finishedAt\" DESC LIMIT 12"
          echo "=== Errors last 12h ==="
          q "SELECT to_char(\"createdAt\",'MM-DD HH24:MI') t, category, event, left(message,300) msg FROM debug_logs WHERE level='error' AND \"createdAt\" > now() - interval '12 hours' ORDER BY \"createdAt\" DESC LIMIT 15"
