name: Diag scan failures (temporary, read-only)

on:
  push:
    branches:
      - claude/diag-scan-failures

jobs:
  diag:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Read recent quick-created products and their logs (read-only)
        run: |
          set -uo pipefail
          cd /deploy
          q() { docker compose --project-directory /volume1/docker/App/hellocal-v2 -f compose.production.yaml --env-file .env.production exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off' <<< "BEGIN READ ONLY; $1; ROLLBACK;"; }
          C="docker compose --project-directory /volume1/docker/App/hellocal-v2 -f compose.production.yaml --env-file .env.production"
          sleep 420
          q "SELECT key, to_char(\"lastStartedAt\",'MM-DD HH24:MI') started, \"lastStatus\" st, left(\"lastMessage\",200) msg FROM scheduled_jobs WHERE key IN ('search-index','maintenance','quick-enrichment-recovery','api-alerts')"
          echo "=== app log (new container) ==="
          $C logs --no-log-prefix --since 8m app 2>&1 | grep -i -E "fejlede|error|meili" | head -20 || true
          echo "=== scan-app log ==="
          $C logs --no-log-prefix --since 8m scan-app 2>&1 | grep -i -E "scheduler|jobs|fejlede" | head -10 || true
