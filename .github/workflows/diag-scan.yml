name: Diag scan failures (temporary, read-only)

on:
  push:
    branches:
      - claude/diag-scan-failures

jobs:
  diag:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Read recent quick-created products and their logs (read-only)
        run: |
          set -uo pipefail
          cd /deploy
          q() { docker compose --project-directory /volume1/docker/App/hellocal-v2 -f compose.production.yaml --env-file .env.production exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off' <<< "BEGIN READ ONLY; $1; ROLLBACK;"; }
          echo "=== All scheduled jobs ==="
          q "SELECT key, enabled, \"intervalMinutes\" iv, \"runAtTime\" at, to_char(\"lastStartedAt\",'MM-DD HH24:MI') started, to_char(\"lastRunAt\",'MM-DD HH24:MI') ran, \"lastStatus\" st, left(\"lastMessage\",120) msg FROM scheduled_jobs ORDER BY \"lastStartedAt\" DESC NULLS LAST"
          echo "=== App container logs (scheduler) ==="
          docker compose --project-directory /volume1/docker/App/hellocal-v2 -f compose.production.yaml --env-file .env.production logs --since 12h app 2>&1 | grep -i -E "scheduler|jobs\]|instrumentation|error" | tail -40 || true
          echo "=== Containers ==="
          docker compose --project-directory /volume1/docker/App/hellocal-v2 -f compose.production.yaml --env-file .env.production ps --format "table {{.Service}}\t{{.Status}}" 2>&1 | head -30 || true
