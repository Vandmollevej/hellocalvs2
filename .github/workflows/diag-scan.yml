name: Diag scan failures (temporary, read-only)

on:
  push:
    branches:
      - claude/diag-scan-failures

jobs:
  diag:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Read recent quick-created products and their logs (read-only)
        run: |
          set -uo pipefail
          cd /deploy
          q() { docker compose --project-directory /volume1/docker/App/hellocal-v2 -f compose.production.yaml --env-file .env.production exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off' <<< "BEGIN READ ONLY; $1; ROLLBACK;"; }
          C="docker compose --project-directory /volume1/docker/App/hellocal-v2 -f compose.production.yaml --env-file .env.production"
          echo "=== App startup log (first 60 lines) ==="
          $C logs --no-log-prefix app 2>&1 | head -60 || true
          echo "=== App log lines mentioning scheduler/jobs/api-keys/instrument ==="
          $C logs --no-log-prefix app 2>&1 | grep -i -E "scheduler|\[jobs\]|api-keys|instrument|register|Prisma|ECONN" | head -40 || true
          echo "=== App env (names only, NEXT/NODE) ==="
          $C exec -T app sh -c 'env | grep -E "^(NEXT_|NODE_ENV|HOSTNAME|PORT)" | sed "s/=.*$/=<set>/"' || true
          echo "=== instrumentation in image ==="
          $C exec -T app sh -c 'ls -la .next/server/instrumentation* 2>&1 | head; ls .next/server | head -30' || true
