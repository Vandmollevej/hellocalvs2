name: hellocal-v2

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  migrate:
    image: ${HELLOCAL_IMAGE:?Set HELLOCAL_IMAGE in .env.production}:${HELLOCAL_TAG:-latest}
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  app:
    image: ${HELLOCAL_IMAGE:?Set HELLOCAL_IMAGE in .env.production}:${HELLOCAL_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      USDA_FDC_API_KEY: ${USDA_FDC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Set ADMIN_SESSION_SECRET in .env.production}
      USER_SESSION_SECRET: ${USER_SESSION_SECRET:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      INTEGRATIONS_REDIRECT_BASE_URL: ${INTEGRATIONS_REDIRECT_BASE_URL:-}
      FITBIT_CLIENT_ID: ${FITBIT_CLIENT_ID:-}
      FITBIT_CLIENT_SECRET: ${FITBIT_CLIENT_SECRET:-}
      WITHINGS_CLIENT_ID: ${WITHINGS_CLIENT_ID:-}
      WITHINGS_CLIENT_SECRET: ${WITHINGS_CLIENT_SECRET:-}
      WITHINGS_REDIRECT_URI: ${WITHINGS_REDIRECT_URI:-}
      GOOGLE_HEALTH_CLIENT_ID: ${GOOGLE_HEALTH_CLIENT_ID:-}
      GOOGLE_HEALTH_CLIENT_SECRET: ${GOOGLE_HEALTH_CLIENT_SECRET:-}
      GOOGLE_HEALTH_REDIRECT_URI: ${GOOGLE_HEALTH_REDIRECT_URI:-}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      POLAR_CLIENT_ID: ${POLAR_CLIENT_ID:-}
      POLAR_CLIENT_SECRET: ${POLAR_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      # Oprettelses-appen (admin scan-invites): invitationslinkets adresse og
      # nøglen til medarbejderes CPR/bank (skal være ens i app og scan-app).
      SCAN_APP_BASE_URL: ${SCAN_APP_BASE_URL:-}
      SCAN_PII_KEY: ${SCAN_PII_KEY:-}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${HELLOCAL_BIND_ADDRESS:-0.0.0.0}:${HELLOCAL_HTTP_PORT:-3100}:3000"
    volumes:
      - ./data/product-images:/app/public/product-images
      - ./data/hellofresh-images:/app/public/hellofresh-images
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
      - edge

  # Oprettelses-appen (docs/OPRETTELSES-APP.md): invite-only medarbejderapp.
  # Samme image og database som app, men HELLOCAL_APP_MODE=scan gør, at
  # middleware.ts kun serverer /scan-ruterne (+ de delte AI/produkt-API'er).
  scan-app:
    image: ${HELLOCAL_IMAGE:?Set HELLOCAL_IMAGE in .env.production}:${HELLOCAL_TAG:-latest}
    restart: unless-stopped
    environment:
      HELLOCAL_APP_MODE: scan
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Set ADMIN_SESSION_SECRET in .env.production}
      SCAN_SESSION_SECRET: ${SCAN_SESSION_SECRET:-}
      SCAN_PII_KEY: ${SCAN_PII_KEY:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${HELLOCAL_BIND_ADDRESS:-0.0.0.0}:${SCAN_APP_HTTP_PORT:-3101}:3000"
    volumes:
      - ./data/product-images:/app/public/product-images
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
      - edge

  image-agent:
    build: ./scripts/image-agent
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?Set GOOGLE_API_KEY in .env.production}
      GOOGLE_CSE_ID: ${GOOGLE_CSE_ID:?Set GOOGLE_CSE_ID in .env.production}
      POLL_INTERVAL_SECONDS: ${IMAGE_AGENT_POLL_INTERVAL_SECONDS:-300}
    volumes:
      - ./data/product-images:/images
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
      - edge

  # Logo-robot (docs/LOGO-AGENT.md): natlig logosøgning via Google Vision
  # (ikke Custom Search). Uden nøgle logger den blot og springer over —
  # bevidst ingen :?-krav, så en manglende nøgle ikke stopper resten af stakken.
  logo-agent:
    build: ./scripts/logo-agent
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      LOGO_AGENT_RUN_HOUR: ${LOGO_AGENT_RUN_HOUR:-3}
      LOGO_AGENT_BATCH_SIZE: ${LOGO_AGENT_BATCH_SIZE:-25}
    volumes:
      - ./data/product-images:/images
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
      - edge

  frida-agent:
    build: ./scripts/frida-import
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      FRIDA_POLL_INTERVAL_SECONDS: ${FRIDA_AGENT_POLL_INTERVAL_SECONDS:-86400}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
      - edge

  quality-control-agent:
    build: ./scripts/quality-control-agent
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      POLL_INTERVAL_SECONDS: ${QUALITY_CONTROL_AGENT_POLL_INTERVAL_SECONDS:-300}
      BATCH_SIZE: ${QUALITY_CONTROL_AGENT_BATCH_SIZE:-10}
    volumes:
      - ./data/product-images:/images
      # DINOv2 model weights (~90MB), downloaded from Hugging Face on first
      # start — cached here so a container restart doesn't re-download them.
      - ./data/quality-control-model-cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
      - edge

  hellofresh-agent:
    build: ./scripts/hellofresh-import
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      HELLOFRESH_POLL_INTERVAL_SECONDS: ${HELLOFRESH_AGENT_POLL_INTERVAL_SECONDS:-120}
      HELLOFRESH_BATCH_SIZE: ${HELLOFRESH_AGENT_BATCH_SIZE:-30}
    volumes:
      - ./data/hellofresh-images:/images
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
      - edge

  rema1000-agent:
    build: ./scripts/rema1000-import
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

networks:
  backend:
    internal: true
  edge:
