# Forside foran app-containeren (docs/DEPLOYMENT.md, "Udrulning uden nedetid").
# Cloudflare Tunnel rammer stadig port 3100 på serveren; den port ejes nu af denne proxy,
# så en ny app-udgave kan startes og blive sund, før den gamle stoppes.
#
# Vigtigt: der sættes ingen X-Forwarded-*/X-Real-IP-headere. Appen læser klientens IP fra
# cf-connecting-ip (admin-IP-begrænsningen) og protokollen fra tunnelens headere; de skal
# videregives uændret.

# Docker-DNS (127.0.0.11) giver alle app-containere; kort cache, så en ny container ses hurtigt.
resolver 127.0.0.11 valid=2s ipv6=off;

server {
    listen 80;
    server_name _;

    access_log off;
    client_max_body_size 100m;

    location / {
        # Variabel i proxy_pass => adressen slås op igen løbende (ikke kun ved opstart).
        set $app_upstream http://app:3000;
        proxy_pass $app_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";

        proxy_connect_timeout 3s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;

        # Under en udrulning kan en forbindelse ramme en container, der netop er stoppet eller
        # endnu ikke er klar: prøv næste adresse (kun forespørgsler, der endnu ikke er sendt,
        # eller sikre metoder som GET).
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 4;
    }
}
